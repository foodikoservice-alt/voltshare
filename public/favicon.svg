<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect width="64" height="64" rx="16" ry="16" fill="white" opacity="0.06"/>

  <!-- Lightning bolt (Zap icon, white, centered) -->
  <g filter="url(#glow)" transform="translate(32,32) scale(1.1)">
    <path
      d="M6.5 -14 L-2 2 L3 2 L-6.5 14 L2 -2 L-3 -2 Z"
      fill="white"
      stroke="white"
      stroke-width="0.5"
      stroke-linejoin="round"
    />
  </g>
</svg>