<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="glowBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glowBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- Top-left inner highlight for glass feel -->
  <rect width="64" height="32" rx="14" ry="14" fill="white" opacity="0.07"/>

  <!-- Lucide Zap icon — exact path, centered & scaled -->
  <!-- Original: viewBox 0 0 24 24, centered at 14,12 scaled 1.5x → translate(14,8) scale(1.5) -->
  <g transform="translate(14, 8) scale(1.5)" filter="url(#glow)">
    <path
      d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"
      fill="white"
      stroke="white"
      stroke-width="0.3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>
</svg>